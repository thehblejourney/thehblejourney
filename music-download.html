<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HBLE Radio | Your Music Download</title>
<style>body{margin:0;min-height:100vh;background:#090909;color:#f5eddd;font:16px Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}.panel{box-sizing:border-box;width:min(100%,510px);padding:32px 22px;text-align:center;background:#15120e;border:1px solid #ac823d;border-radius:18px;box-shadow:0 15px 50px #000}.crown{font-size:45px;color:#e8bd63}.brand{font-size:34px;font-weight:900;letter-spacing:3px;color:#e7bd68}.radio{letter-spacing:3px;font-weight:bold;margin:12px 0 30px}h1{font-size:25px;line-height:1.3}#song{color:#e9c474;font-size:22px;font-weight:bold;overflow-wrap:anywhere}.btn{display:inline-block;background:#e5b958;color:#16100b;padding:15px 25px;border-radius:30px;font-weight:800;text-decoration:none;margin:18px 0}.back{color:#eac579;display:block;margin-top:20px}.foot{color:#cba85e;font-style:italic;margin-top:30px}</style></head>
<body><main class="panel"><div class="crown">♛</div><div class="brand">HBLE STUDIOS</div><div class="radio">♫ HBLE RADIO ♫</div><h1>Your music download is ready!</h1><p id="song"></p><p id="status" role="status">Preparing your song…</p><a id="download" class="btn" hidden>↓ DOWNLOAD YOUR SONG</a><a class="back" href="/radio.html">Back to HBLE Radio</a><p class="foot">Humble Beginnings. Legendary Endings.</p></main>
<script>
(function(){
  'use strict';
  const songs={
    'Every Way':'every-way.mp3',
    'Every Way — Slow Roll':'every-way-slow-roll.mp3',
    'Believe':'believe.mp3',
    '20/20 Perfect Sight':'20-20-perfect-sight.mp3',
    "Don't Be!":'dont-be.mp3',
    'Spittin Image — Remix 2.0':'spittin-image-remix-2.mp3'
  };
  const title=new URLSearchParams(location.search).get('song')||'';
  const status=document.getElementById('status');
  if(!Object.prototype.hasOwnProperty.call(songs,title)){
    document.querySelector('h1').textContent='Download not available';
    status.textContent='Please choose an approved downloadable song from HBLE Radio.';
    return;
  }
  document.getElementById('song').textContent='♫ '+title;
  const link=document.getElementById('download');
  link.href='/audio/hble-radio/'+encodeURIComponent(songs[title]);
  link.download=songs[title];
  link.hidden=false;
  status.textContent='Your download should begin automatically. If it does not, tap the gold button below.';
  // Same-origin HTML download attribute, matching the existing HBLE Radio download buttons.
  // Some mobile browsers require the fallback user tap.
  link.click();
})();
</script></body></html>
