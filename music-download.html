n-top:22vh}}/* HBLE luxury download presentation */

body{width:100%;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 28%,#56350f 0%,#1a1108 34%,#050403 76%)!important;overflow-x:hidden}

<body><svg class="hero-crown" viewBox="0 0 620 370" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7e4b0d"/><stop offset=".3" stop-color="#fff2a8"/><stop offset=".55" stop-color="#d79620"/><stop offset=".78" stop-color="#fff0a0"/><stop offset="1" stop-color="#85500b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><path d="M70 112 L160 175 L221 43 L310 164 L400 43 L462 175 L550 112 L515 283 Q310 322 105 283 Z" fill="url(#gold)" stroke="#ffe6a0" stroke-width="7"/><path d="M95 252 Q310 294 525 252 L515 309 Q310 350 105 309 Z" fill="url(#gold)" stroke="#fff1b1" stroke-width="6"/><g fill="#fff9dc" stroke="#e4ad3c" stroke-width="5"><circle cx="70" cy="112" r="16"/><circle cx="221" cy="43" r="17"/><circle cx="400" cy="43" r="17"/><circle cx="550" cy="112" r="16"/><path d="M310 136 l24 34 -24 34 -24 -34z"/></g><g fill="#fff9dc" opacity=".8"><circle cx="168" cy="260" r="8"/><circle cx="238" cy="275" r="8"/><circle cx="310" cy="280" r="8"/><circle cx="382" cy="275" r="8"/><circle cx="452" cy="260" r="8"/></g></svg><main class="panel"><div class="crown">♛</div><div class="brand">HBLE STUDIOS</div><div class="radio">♫ HBLE RADIO ♫</div><h1>Your music download is ready!</h1><p id="song"></p><p id="status" role="status">Preparing your song…</p><a id="download" class="btn" hidden>↓ DOWNLOAD YOUR SONG</a><a class="back" href="/radio.html">Back to HBLE Radio</a><p class="foot">Humble Beginnings. Legendary Endings.</p></main>
<script>
(function(){
  'use strict';
  const songs={
    'Every Way':'every-way.mp3',
    'Every Way — Slow Roll':'every-way-slow-roll.mp3',
    'Believe':'believe.mp3',
    '20/20 Perfect Sight':'20-20-perfect-sight.mp3',
    "Don't Be!":'dont-be.mp3',
    'Spittin Image — Remix 2.0':'spittin-image-remix-2.mp3'
  };
  const title=new URLSearchParams(location.search).get('song')||'';
  const status=document.getElementById('status');
  if(!Object.prototype.hasOwnProperty.call(songs,title)){
    document.querySelector('h1').textContent='Download not available';
    status.textContent='Please choose an approved downloadable song from HBLE Radio.';
    return;
  }
  document.getElementById('song').textContent='♫ '+title;
  const link=document.getElementById('download');
  link.href='/audio/hble-radio/'+encodeURIComponent(songs[title]);
  link.download=songs[title];
  link.hidden=false;
  status.textContent='Your download should begin automatically. If it does not, tap the gold button below.';
  // Same-origin HTML download attribute, matching the existing HBLE Radio download buttons.
  // Some mobile browsers require the fallback user tap.
  link.click();
})();
</script></body></html>
