<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HBLE artwork and design gallery.">
  <title>Artwork & Designs | HBLE Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050505;--panel:#0d0d0d;--text:#f8f4ec;--muted:#aaa49a;--gold:#d5ad61;--gold2:#f2d998;--line:rgba(213,173,97,.27)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.wrap{width:min(1220px,92vw);margin:auto}
    header{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}.bar{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}.brand img{width:42px;height:42px;object-fit:contain}.back{border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-weight:700;color:#ddd5c7}.back:hover{border-color:var(--gold);color:var(--gold2)}
    .intro{padding:68px 0 34px}.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2);font-weight:800}.intro h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,6.6rem);line-height:.92;letter-spacing:-.04em;margin:.5rem 0 1rem}.intro p{color:var(--muted);font-size:1.05rem;max-width:700px;line-height:1.7}
    .gallery{columns:3 300px;column-gap:16px;padding:14px 0 80px}.art{width:100%;display:block;margin:0 0 16px;padding:0;border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;background:var(--panel);cursor:pointer;break-inside:avoid;transition:.2s}.art:hover{border-color:var(--line);transform:translateY(-2px)}.art img{width:100%;height:auto;object-fit:contain;background:#090909}.caption{padding:12px 14px 14px;text-align:left;color:#d8d1c6;font-size:.86rem}
    .lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.96);display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lb-inner{width:min(1200px,96vw);max-height:94vh;position:relative}.lightbox img{width:100%;max-height:86vh;object-fit:contain;border-radius:12px;background:#050505}.close{position:absolute;right:6px;top:6px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.8);color:white;font-size:1.5rem;cursor:pointer}.lb-title{padding:10px 4px;color:#ddd5c7;font-size:.9rem}.note{padding-bottom:54px;color:#777067;font-size:.8rem;text-align:center}
    @media(max-width:650px){.brand span{font-size:.9rem}.intro{padding-top:46px}.gallery{columns:2 145px;column-gap:10px}.art{margin-bottom:10px;border-radius:12px}.caption{font-size:.72rem;padding:9px 10px 10px}.back{padding:9px 12px;font-size:.82rem}.lightbox{padding:12px}.close{width:42px;height:42px}}
  </style>
</head>
<body>
  <header><div class="wrap bar"><a class="brand" href="index.html"><img src="images/crown.png" alt="HBLE crown"><span>HBLE STUDIOS</span></a><a class="back" href="index.html">← Back to HBLE</a></div></header>
  <main class="wrap">
    <section class="intro"><div class="eyebrow">HBLE Portfolio Folder</div><h1>Artwork & Designs</h1><p>A simple collection of HBLE artwork, concepts, visual designs and creative work. Tap any image to open it at full size.</p></section>
    <section class="gallery" id="gallery">
      <button class="art" data-title="HBLE Visual Identity"><img src="images/hblelogoimageworld.jpg" alt="HBLE visual identity artwork" loading="eager"><div class="caption">HBLE Visual Identity</div></button>
      <button class="art" data-title="HBLE Creative World"><img src="images/hbleanime.jpg" alt="HBLE creative artwork" loading="lazy"><div class="caption">HBLE Creative World</div></button>
      <button class="art" data-title="Signature Artwork 01"><img src="images/image1.jpg" alt="HBLE artwork 1" loading="lazy"><div class="caption">Signature Artwork 01</div></button>
      <button class="art" data-title="Signature Artwork 02"><img src="images/image2.jpg" alt="HBLE artwork 2" loading="lazy"><div class="caption">Signature Artwork 02</div></button>
      <button class="art" data-title="Signature Artwork 03"><img src="images/image3.jpg" alt="HBLE artwork 3" loading="lazy"><div class="caption">Signature Artwork 03</div></button>
      <button class="art" data-title="Signature Artwork 04"><img src="images/image4.jpg" alt="HBLE artwork 4" loading="lazy"><div class="caption">Signature Artwork 04</div></button>
      <button class="art" data-title="Signature Artwork 05"><img src="images/image5.jpg" alt="HBLE artwork 5" loading="lazy"><div class="caption">Signature Artwork 05</div></button>
      <button class="art" data-title="Signature Artwork 06"><img src="images/image6.jpg" alt="HBLE artwork 6" loading="lazy"><div class="caption">Signature Artwork 06</div></button>
      <button class="art" data-title="Signature Artwork 07"><img src="images/image7.jpg" alt="HBLE artwork 7" loading="lazy"><div class="caption">Signature Artwork 07</div></button>
      <button class="art" data-title="Signature Artwork 08"><img src="images/image8.jpg" alt="HBLE artwork 8" loading="lazy"><div class="caption">Signature Artwork 08</div></button>
      <button class="art" data-title="Logo & Brand Design"><img src="images/logoimage9.jpg" alt="HBLE logo and brand design" loading="lazy"><div class="caption">Logo & Brand Design</div></button>
      <button class="art" data-title="Character & Portrait Design"><img src="images/Keoka.jpg" alt="HBLE character portrait design" loading="lazy"><div class="caption">Character & Portrait Design</div></button>
      <button class="art" data-title="Merch Design 01"><img src="images/merch1.png" alt="HBLE merchandise design 1" loading="lazy"><div class="caption">Merch Design 01</div></button>
      <button class="art" data-title="Merch Design 02"><img src="images/merch2.png" alt="HBLE merchandise design 2" loading="lazy"><div class="caption">Merch Design 02</div></button>
      <button class="art" data-title="Merch Design 03"><img src="images/merch3.png" alt="HBLE merchandise design 3" loading="lazy"><div class="caption">Merch Design 03</div></button>
      <button class="art" data-title="Merch Design 04"><img src="images/merch4.png" alt="HBLE merchandise design 4" loading="lazy"><div class="caption">Merch Design 04</div></button>
    </section>
    <div class="note">HBLE ENTERPRISES INC. • Humble Beginnings. Legendary Endings.</div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer"><div class="lb-inner"><button class="close" id="close" aria-label="Close">×</button><img id="full" alt=""><div class="lb-title" id="lbTitle"></div></div></div>
  <script>
    const box=document.getElementById('lightbox'),full=document.getElementById('full'),title=document.getElementById('lbTitle');
    document.querySelectorAll('.art').forEach(card=>card.addEventListener('click',()=>{const img=card.querySelector('img');full.src=img.src;full.alt=img.alt;title.textContent=card.dataset.title||'';box.classList.add('open');document.body.style.overflow='hidden';}));
    function closeBox(){box.classList.remove('open');full.src='';document.body.style.overflow='';}
    document.getElementById('close').addEventListener('click',closeBox);box.addEventListener('click',e=>{if(e.target===box)closeBox();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox();});
  </script>
</body>
</html>
