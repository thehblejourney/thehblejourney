name: Import HBLE Services master

on:
  push:
    paths:
      - '.github/workflows/import-services-master.yml'
  workflow_dispatch:

permissions:
  contents: write

# Second commit intentionally triggers this one-time importer after workflow registration.
jobs:
  import-master:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl -fL --retry 3 --retry-delay 2 -o media/hble-services-master.mp4 'https://at.adobe.com/niDFts1JonKlyIfD'
          test "$(stat -c%s media/hble-services-master.mp4)" = "3233732"
          echo 'cf1a75704dc2e992d4d424d591370f12a178ac6aaee7d398aee4d6a086ada6fe  media/hble-services-master.mp4' | sha256sum -c -

      - name: Commit verified master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HBLE Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add media/hble-services-master.mp4
          if git diff --cached --quiet; then
            echo 'Master already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'Add original HBLE Services master video'
          git push origin HEAD:master
